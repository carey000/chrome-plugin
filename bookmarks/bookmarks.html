<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>书签管理</title>
    <script src="../src/theme-init.js"></script>
    <link rel="stylesheet" href="../src/theme.css" />
    <link rel="stylesheet" href="./bookmarks.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="topbar-left">
          <span class="app-name">书签管理</span>
          <label class="search">
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
              <circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8" />
              <path d="m15.5 15.5 5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
            <input id="searchInput" type="search" autocomplete="off" spellcheck="false" placeholder="搜索标题 / 网址 / 标签…" aria-label="搜索书签" />
          </label>
        </div>
        <div class="topbar-right">
          <nav class="header-links">
            <a class="header-link" id="vBookmarksEntry" href="chrome-extension://odhjcodnoebmndcihdedenkmdmklpihb/pages/standalone.html" target="_blank" rel="noopener noreferrer" title="vBookmarks 书签管理">
              <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
                <rect x="4" y="5" width="11" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.7" />
                <path d="M9 3.5h9A1.5 1.5 0 0 1 19.5 5v14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
              </svg>
              vBookmarks
            </a>
            <a class="header-link" id="raindropEntry" href="https://app.raindrop.io/my/0" target="_blank" rel="noopener noreferrer" title="Raindrop.io 书签管理">
              <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
                <path d="M12 3c3.5 4.4 6 7.8 6 10.8A6 6 0 0 1 6 13.8C6 10.8 8.5 7.4 12 3Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
              </svg>
              Raindrop
            </a>
            <a class="header-link header-link--accent" id="bookmarksEntry" href="./bookmarks.html" title="书签管理">
              <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
                <path d="M6 4.5A1.5 1.5 0 0 1 7.5 3h9A1.5 1.5 0 0 1 18 4.5V21l-6-4-6 4V4.5Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
              </svg>
              书签管理
            </a>
          </nav>
          <select class="select" id="sortSelect" title="排序方式" aria-label="排序方式">
            <option value="default">默认顺序</option>
            <option value="title">按标题</option>
            <option value="newest">最近添加</option>
            <option value="host">按域名</option>
          </select>
          <button class="top-btn" id="addFolderBtn" type="button" title="在当前文件夹新建子文件夹">+ 文件夹</button>
          <button class="top-btn top-btn--primary" id="addBookmarkBtn" type="button" title="在当前文件夹新建书签">+ 书签</button>
          <button class="theme-toggle" data-theme-toggle type="button" title="切换到暗蓝主题" aria-label="切换到暗蓝主题">
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z" />
            </svg>
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4.2" />
              <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main class="main">
      <div class="layout">
        <!-- 左：文件夹树 + 标签筛选（vBookmarks / Raindrop 式常驻导航） -->
        <aside class="sidebar">
          <!-- Chrome 原生标签组：与书签树并列的导航区，展示全部组 -->
          <section class="groups" id="groupsPanel" hidden>
            <div class="groups-head">
              <div class="groups-heading">
                <h2 class="groups-title">标签组</h2>
                <span class="groups-summary" id="groupsSummary"></span>
              </div>
              <button class="icon-btn" id="refreshGroups" type="button" title="刷新标签组">
                <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
                  <path d="M20 11a8 8 0 1 0-2.3 6M20 5v6h-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </button>
            </div>
            <div class="groups-list" id="groupsList"></div>
          </section>

          <div class="sidebar-head sidebar-head--folders">
            <span>文件夹</span>
            <button class="icon-btn" id="refreshTree" type="button" title="重新读取书签树">
              <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
                <path d="M20 11a8 8 0 1 0-2.3 6M20 5v6h-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>
          </div>
          <div class="folder-tree" id="folderTree"></div>
          <div class="sidebar-head sidebar-head--tags" id="tagHead" hidden>标签</div>
          <div class="tag-list" id="tagList"></div>
        </aside>

        <div class="content">
          <div class="crumbs-bar">
            <nav class="crumbs" id="crumbs" aria-label="书签路径"></nav>
            <div class="view-switch" role="group" aria-label="视图切换">
              <button class="view-btn" id="viewList" type="button" title="列表视图" aria-label="列表视图" aria-pressed="false">
                <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
                  <path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                </svg>
              </button>
              <button class="view-btn is-active" id="viewGrid" type="button" title="卡片视图" aria-label="卡片视图" aria-pressed="true">
                <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
                  <path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
                </svg>
              </button>
            </div>
          </div>

          <div class="filter-bar" id="filterBar" hidden></div>
          <div class="grid" id="grid"></div>
          <div class="empty" id="empty" hidden>
            <div class="empty-icon"></div>
            <p>这个文件夹里还没有内容</p>
          </div>
        </div>
      </div>
    </main>

    <div class="modal-mask" id="editorMask" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="editorTitle">
        <div class="modal-head">
          <h2 id="editorTitle">编辑书签</h2>
          <button class="icon-btn" id="closeEditor" type="button" aria-label="关闭">&times;</button>
        </div>
        <form id="editorForm">
          <label class="field">
            <span class="field-label">标题</span>
            <input class="field-input" id="editTitle" type="text" autocomplete="off" required />
          </label>
          <label class="field" id="urlField">
            <span class="field-label">网址</span>
            <textarea class="field-input field-textarea" id="editUrl" rows="3" autocomplete="off" spellcheck="false" wrap="soft"></textarea>
          </label>
          <label class="field" id="tagsField">
            <span class="field-label">标签（逗号分隔）</span>
            <input class="field-input" id="editTags" type="text" autocomplete="off" spellcheck="false" placeholder="工作, 设计, 待读" />
          </label>
          <p class="form-error" id="formError" hidden></p>
          <div class="modal-actions">
            <button class="btn btn-ghost" id="cancelEditor" type="button">取消</button>
            <button class="btn btn-primary" type="submit">保存</button>
          </div>
        </form>
      </div>
    </div>

    <div class="modal-mask" id="deleteMask" hidden>
      <div class="modal modal--danger" role="dialog" aria-modal="true" aria-labelledby="deleteTitle">
        <div class="modal-head">
          <h2 id="deleteTitle">确认批量删除</h2>
          <button class="icon-btn" id="deleteClose" type="button" aria-label="关闭">&times;</button>
        </div>
        <p class="delete-warning" id="deleteWarning"></p>
        <div class="delete-list" id="deleteList"></div>
        <div class="modal-actions">
          <button class="btn btn-ghost" id="deleteCancel" type="button">取消</button>
          <button class="btn btn-danger" id="deleteConfirm" type="button">删除</button>
        </div>
      </div>
    </div>

    <div class="batch-bar" id="batchBar" hidden>
      <span class="batch-count" id="batchCount"></span>
      <button class="batch-btn" id="batchSelectAll" type="button">全选</button>
      <button class="batch-btn" id="batchTag" type="button">加标签</button>
      <select class="batch-select" id="batchMove" aria-label="移动到文件夹">
        <option value="">移动到…</option>
      </select>
      <button class="batch-btn" id="batchOpen" type="button">全部打开</button>
      <button class="batch-btn batch-btn--danger" id="batchDelete" type="button">删除</button>
      <button class="batch-btn" id="batchClear" type="button">取消</button>
    </div>

    <div class="toast" id="toast" hidden>
      <span id="toastText"></span>
      <button class="toast-undo" id="toastUndo" type="button">撤销</button>
    </div>

    <script src="../src/favicon.js"></script>
    <script src="../src/theme.js"></script>
    <script src="./bookmarks.js"></script>
  </body>
</html>
